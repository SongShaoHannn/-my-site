<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宋韶晗-个人主页</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --main-color: #56a7fe;
            --bg-color: #f5f7fa;
            --text-color: #333333;
        }

        body {
            background-color: var(--bg-color);
        }

        h1 {
            color: rgb(0, 0, 0);
            font-size: 28px;
        }

        p {
            color: var(--text-color);
            font-size: 16px;
        }

        img {
            width: 120px;
            border-radius: 30px;
        }

        button {
            background-color: var(--main-color);
            color: var(--text-color);
            padding: 10px 24px;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #c6c9d0;
            cursor: pointer;
            transform: translateY(-3px);
        }

        .card {
            background-color: white;
            width: 360px;
            margin: 40px auto;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .skill {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .skill-item {
            background-color: #f0f4ff;
            padding: 16px 24px;
            border-radius: 8px;
            border: 2px solid var(--main-color);
            transition: all 0.3s;
        }

        .skill-item:hover {
            background-color: #c6c9d0;
            cursor: pointer;
        }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            text-align: center;
        }

        .works-card img {
            height: 240px;
            border-radius: 8px;
            transition: transform 0.3s;
            width: 100%;
            object-fit: cover;
        }

        .works-card img:hover {
            transform: scale(1.05);
        }

        .works-card {
            position: relative;
            overflow: hidden;
        }

        .works-card .overlay {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .works-card:hover .overlay {
            opacity: 1;
        }

        h3 {
            display: flex;
            justify-content: center;
        }

        footer {
            text-align: center;
            padding: 24px;
            margin-top: 40px;
            background-color: var(--bg-color);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
        }

        .top a {
            margin-left: 20px;
            text-decoration: none;
            color: var(--main-color);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #8fe5facc, var(--bg-color));
        }

        .hero h1 {
            animation: fadeInUp 1.2s;
        }

        .about {
            display: flex;
            align-items: center;
            gap: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .about img {
            width: 200px;
            border-radius: 50%;
        }

        .skill-bar {
            margin-bottom: 24px;
        }

        .bar-label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .bar {
            height: 12px;
            border-radius: 6px;
            background-color: #e0e0e0;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            background-color: var(--main-color);
            animation: fillBar 1s;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            background-color: var(--main-color);
            color: white;
            border-radius: 20px;
            font-size: 12px;

        }

        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            display: none;
        }

        #lightbox.show {
            display: flex;

        }

        #lightbox img {
            position: relative;
            width: 80%;
            max-width: 800px;
            border-radius: 8px;
        }

        .lightbox-btns {
            display: flex;
            gap: 16px;
        }

        #lightbox button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        @keyframes fillBar {
            from {
                width: 0;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @media(max-width:600px) {
            .card {
                width: 90%;
            }

            .skill {
                flex-direction: column;
                align-items: center;
            }

            .works-grid {
                grid-template-columns: repeat(1, 1fr);
            }

            .works-card img {
                width: 90%;

            }

            .top {
                flex-direction: column;
                gap: 8px;
            }

            .about {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <header class="top">

        <nav>

            <a href="#skills">技能</a>
            <a href="#works">作品</a>

    </header>

    <main>

        <section id="works">

                <div class="works-card">

                <div class="works-card">

                <div class="works-card">

        <section>

        </section>

    <footer id="contact">
        <p>📧 邮箱: <a style="text-decoration: none;" href="mailto:2122959720@qq.com">2122959720@qq.com</a></p>
        <p>© 2026 宋韶晗</p>
        <p>🐙 GitHub：<a style="text-decoration: none;"
                href="https://github.com/SongShaoHannn/-my-site">SongShaoHannn</a></p>
    </footer>
    <div id="lightbox">
        <img src="" alt="预览大图">
        <div class="lightbox-btns">
            <button id="prevBtn">◀</button>
            <button id="closeBtn">✕</button>
            <button id="nextBtn">▶</button>
        </div>
    </div>
    <script>
        let myName = "宋韶晗";
        let myAge = 18;
        console.log("我叫" + myName, "年龄" + myAge + "岁");

        function sayHello() {
            greet("小明");
            console.log("欢迎来到我的网站");
        }
        sayHello();

        function greet(name) {
            console.log("你好!" + name);
        }

        function getCurrentTime() {
            let now = new Date();
            let hour = now.getHours();
            let minute = now.getMinutes();
            return hour + ":" + minute;
        }
        console.log("现在时间是: " + getCurrentTime());

        function getGreeting() {
            let hour = new Date().getHours()
            if (hour < 12) {
                return "早上好 ☀️"
            } else if (hour < 18) {
                return "下午好 🌤️"
            } else {
                return "晚上好 🌙"
            }
        }
        console.log(getGreeting())
        let title = document.querySelector("h1");
        title.textContent = "欢迎来到我的网站!"
        title.style.color = "red"
        title.style.fontSize = "36px"
        let button = document.querySelector("#addBtn");
        /*button.addEventListener("click",function(){
            alert("按键被点击了!")
        })  */
        let count = 0;
        let span = document.querySelector("#count")
        button.addEventListener("click", function () {
            count = count + 1;
            span.textContent = count;
        })
        let card = document.querySelector(".card");
        console.log(title);
        let button2 = document.querySelector("#addBtn2");
        button2.addEventListener("click", function () {
            count = 0;
            span.textContent = count;
        })
        let lightbox = document.querySelector("#lightbox");
        let bigImg = document.querySelector("#lightbox img");
        let cards = document.querySelectorAll(".works-card img");
        let currentIndex = 0;
        cards.forEach(function (img, index) {
            img.addEventListener("click", function () {
                currentIndex = index;
                bigImg.src = img.src;
                lightbox.classList.add("show");
            })
        })
        function showImage(i) {
            currentIndex = i;
            bigImg.src = cards[i].src;
        }
        let prevBtn = document.querySelector("#prevBtn");
        let nextBtn = document.querySelector("#nextBtn");
        prevBtn.addEventListener("click", function () {
            if (currentIndex > 0) {
                showImage(currentIndex - 1);
            }
        })
        nextBtn.addEventListener("click", function () {
            if (currentIndex < cards.length - 1) {
                showImage(currentIndex + 1);
            }
        })
        let closeBtn = document.querySelector("#closeBtn");
        closeBtn.addEventListener("click", function () {
            lightbox.classList.remove("show");
        })
        lightbox.addEventListener("click", function (e) {
            if (e.target === lightbox) {
                lightbox.classList.remove("show");
            }
        })
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                lightbox.classList.remove("show");
            }
        })
    </script>
</body>

</html>
