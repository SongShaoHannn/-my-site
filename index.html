<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宋韶晗-个人主页</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #ddff61c4;
        }

        h1 {
            color: rgb(0, 0, 0);
            font-size: 28px;
        }

        p {
            color: #303030;
            font-size: 16px;
        }

        img {
            width: 120px;
            border-radius: 30px;
        }

        button {
            background-color: #56a7fe;
            color: white;
            padding: 10px 24px;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #c6c9d0;
            cursor: pointer;
            transform: translateY(-3px);
        }

        .card {
            background-color: white;
            width: 360px;
            margin: 40px auto;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .skill {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .skill-item {
            background-color: #f0f4ff;
            padding: 16px 24px;
            border-radius: 8px;
            border: 2px solid #56a7fe;
            transition: all 0.3s;
        }

        .skill-item:hover {
            background-color: #c6c9d0;
            cursor: pointer;
        }

        .works {
            
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 16px;
        }

        .works img {
            height: 380px;
            border-radius: 8px;
            transition: transform 0.3s;
            width: 100%;
            object-fit: cover;
        }

        .works img:hover {
            transform: scale(1.05);
        }

        h3 {
            display: flex;
            justify-content: center;
        }

        footer {
            text-align: center;
            padding: 24px;
            margin-top: 40px;
            background-color: white;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
        }

        .top a {
            margin-left: 20px;
            text-decoration: none;
            /* 去掉链接的下划线 */
            color: #0099ff;
        }

        @media(max-width:600px) {
            .card {
                width: 90%;
            }

            .skill {
                flex-direction: column;
                align-items: center;
            }

            .works {
                flex-direction: column;
                align-items: center;
                grid-template-columns: repeat(1,1fr);
            }

            .works img {
                width: 90%;
                
            }

            .top {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body>
    <header class="top">
        <div class="logo">宋韶晗</div>
        <nav>
            <a href="#">首页</a>
            <a href="#works">作品</a>
            <a href="#contact">联系</a>
        </nav>
    </header>

    <main>
        <section>
            <div class="card">
                <h1>姓名:宋韶晗</h1>
                <h2>专业:计算机</h2>
                <p>简介:一枚帅哥</p>
                <img src="images/彭于晏.jpg"
                    alt="图片错误">
                <br>
                <button>联系我</button>
                <button>查看作品</button>
                <p>会用的软件:</p>
                <div class="skill">
                    <div class="skill-item">Adobe Photoshop</div>
                    <div class="skill-item">VSCode</div>
                    <div class="skill-item">Claude Code</div>
                </div>
            </div>
        </section>

        <section id="works">
            <h3>我的作品</h3>
            <div class="works">
                <img src="images/拼贴图.jpg" alt="作品1">
                <img src="images/树叶.jpg" alt="作品2">
                <img src="images/故宫.jpg" alt="作品3">
            </div>
        </section>

        <section>
            <h4>你点击了<span id="count">0</span>次</h4>
            <button id="addBtn">+1</button>
            <button id="addBtn2">重置</button>
        </section>
    </main>

    <footer id="contact">
        <p>📧 邮箱:2122959720@qq.com</p>
        <p>© 2026 宋韶晗</p>
    </footer>

    <script>
        let myName = "宋韶晗";
        let myAge = 18;
        console.log("我叫" + myName, "年龄" + myAge + "岁");

        function sayHello() {
            greet("小明");
            console.log("欢迎来到我的网站");
        }
        sayHello();

        function greet(name) {
            console.log("你好!" + name);
        }

        function getCurrentTime() {
            let now = new Date();
            let hour = now.getHours();
            let minute = now.getMinutes();
            return hour + ":" + minute;
        }
        console.log("现在时间是: " + getCurrentTime());

        function getGreeting() {
            let hour = new Date().getHours()
            if (hour < 12) {
                return "早上好 ☀️"
            } else if (hour < 18) {
                return "下午好 🌤️"
            } else {
                return "晚上好 🌙"
            }
        }
        console.log(getGreeting())
        let title = document.querySelector("h1");
        title.textContent = "欢迎来到我的网站!"
        title.style.color = "red"
        title.style.fontSize = "36px"
        let button = document.querySelector("#addBtn");
        /*button.addEventListener("click",function(){
            alert("按键被点击了!")
        })  */
        let count = 0;
        let span = document.querySelector("#count")
        button.addEventListener("click", function () {
            count = count + 1;
            span.textContent = count;
        })
        let card = document.querySelector(".card");
        console.log(title);
        let button2 = document.querySelector("#addBtn2");
        button2.addEventListener("click", function () {
            count = 0;
            span.textContent = count;
        })

    </script>
</body>

</html>
